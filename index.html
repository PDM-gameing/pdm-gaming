
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDM GAMING</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f7f7fa;color:#20212a;
 font-family:Arial,sans-serif;padding-bottom:85px
}
header{
 background:#fff;padding:15px;
 display:flex;align-items:center;
 justify-content:space-between;
 position:sticky;top:0;z-index:10;
 box-shadow:0 3px 15px #0000000b
}
.logo{font-size:23px;font-weight:900;color:#e52d62}
.logo span{color:#303344}
.wallet{
 border:0;border-radius:12px;padding:12px 17px;
 color:white;font-weight:bold;
 background:linear-gradient(120deg,#ed48a0,#ed344c)
}
.banner{
 margin:16px;padding:25px 20px;
 border-radius:18px;color:white;
 background:linear-gradient(120deg,#29165c,#e33373);
 box-shadow:0 8px 20px #a92c6b33
}
.banner h1{font-size:25px;margin:0 0 10px}
.banner p{font-size:13px;color:#f9e6f1}
.banner button{
 background:white;color:#d92f67;
 border:0;padding:11px 18px;
 border-radius:9px;font-weight:bold
}
.search{padding:0 16px;display:flex;gap:8px}
.search input{
 flex:1;min-width:0;border:1px solid #e4e4eb;
 background:white;padding:14px;border-radius:12px;
 outline:none;font-size:14px
}
.search button{
 border:0;border-radius:12px;
 background:#ed3869;color:white;padding:0 16px
}
.categories{
 display:flex;gap:10px;overflow-x:auto;
 padding:18px 16px 5px
}
.category{
 flex-shrink:0;background:white;
 border:1px solid #eee;border-radius:12px;
 padding:12px 17px;font-size:13px;font-weight:bold;
 cursor:pointer
}
.category.active{
 background:#fff0f5;color:#e52d62;
 border-color:#ef9bb7
}
.section{padding:15px 16px}
.heading{
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:15px
}
.heading h2{font-size:19px;margin:0}
.heading a{color:#e52d62;font-size:13px}
.products{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:17px 12px
}
.product{
 background:white;border-radius:14px;
 overflow:hidden;box-shadow:0 4px 15px #17172a0a;
 border:1px solid #eee
}
.thumb{
 height:125px;position:relative;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#1269b8,#59c7f3);
 color:white;text-align:center;padding:10px
}
.thumb.pink{background:linear-gradient(135deg,#9d287c,#ff80b2)}
.thumb.gold{background:linear-gradient(135deg,#72500c,#e5ba51)}
.thumb.purple{background:linear-gradient(135deg,#382078,#a47aff)}
.thumb strong{font-size:19px;text-shadow:0 2px 5px #0008}
.sold{
 position:absolute;bottom:6px;left:5px;right:5px;
 background:#245bd9;color:white;
 padding:6px 3px;border-radius:6px;
 font-size:10px
}
.heart{
 position:absolute;right:8px;top:8px;
 background:#ffffffdf;color:#e52d62;
 border:0;border-radius:50%;width:28px;height:28px
}
.info{padding:10px}
.name{font-size:13px;font-weight:bold;min-height:34px}
.game{font-size:11px;color:#888;margin:5px 0}
.price{
 color:#df3347;font-size:15px;font-weight:900;
 margin:9px 0
}
.old{color:#aaa;text-decoration:line-through;
 font-size:11px;margin-left:4px}
.buy{
 width:100%;border:0;border-radius:8px;
 padding:10px;background:#ed3869;
 color:white;font-weight:bold
}
.seller{
 margin:15px;padding:20px;border-radius:15px;
 background:#222c43;color:white
}
.seller h3{margin-top:0}
.seller button{
 border:0;border-radius:8px;
 padding:12px 16px;background:#f3b949;
 font-weight:bold
}
.support{
 position:fixed;right:15px;bottom:100px;
 background:#19a84b;color:white;
 width:58px;height:58px;border-radius:50%;
 border:0;font-size:12px;font-weight:bold;
 box-shadow:0 5px 15px #0003;z-index:15
}
.bottom{
 position:fixed;bottom:0;left:0;right:0;
 background:white;display:grid;
 grid-template-columns:repeat(4,1fr);
 padding:10px 3px 7px;
 border-top:1px solid #eee;z-index:20
}
.bottom button{
 background:none;border:0;color:#686873;
 font-size:11px;font-weight:bold;padding:5px 0
}
.bottom button.active{color:#e52d62}
.bottom .symbol{font-size:21px;display:block;margin-bottom:4px}
@media(min-width:700px){
 body{max-width:900px;margin:auto}
 .products{grid-template-columns:repeat(3,1fr)}
 .thumb{height:180px}
}
</style>
</head>
<body>

<header>
 <div class="logo">PDM <span>GAMING</span></div>
 <button class="wallet" onclick="alert('Khu vực nạp tiền sẽ được kết nối ở bước tiếp theo')">
  ◉ Nạp tiền
 </button>
</header>

<div class="banner">
 <h1>🎮 PDM GAMING</h1>
 <p>Thiên đường tài khoản game – Giao dịch tiện lợi</p>
 <button onclick="document.getElementById('accounts').scrollIntoView()">
  Khám phá ngay →
 </button>
</div>

<div class="search">
 <input id="search" placeholder="Tìm acc game bạn yêu thích...">
 <button onclick="searchAcc()">⌕</button>
</div>

<div class="categories">
 <div class="category active" onclick="filter('Tất cả',this)">Tất cả</div>
 <div class="category" onclick="filter('Liên Quân',this)">⚔️ Liên Quân</div>
 <div class="category" onclick="filter('Free Fire',this)">🔥 Free Fire</div>
 <div class="category" onclick="filter('Roblox',this)">🎲 Roblox</div>
</div>

<section class="section" id="accounts">
 <div class="heading">
  <h2>🔥 Acc nổi bật</h2>
  <a href="#accounts">Xem tất cả →</a>
 </div>
 <div class="products" id="products"></div>
</section>

<div class="seller">
 <h3>🏪 Trở thành đối tác PDM</h3>
 <p>Bạn có acc game muốn bán? Đăng ký gian hàng và kinh doanh cùng chúng tôi.</p>
 <button onclick="alert('Đăng ký người bán sẽ được xây dựng ở bước tiếp theo')">
  Đăng ký bán acc →
 </button>
</div>

<button class="support" onclick="alert('Khu vực hỗ trợ khách hàng')">
 Hỗ trợ
</button>

<nav class="bottom">
 <button class="active" onclick="go('top')">
  <span class="symbol">⌂</span>Trang chủ
 </button>
 <button onclick="alert('Danh sách acc đã mua')">
  <span class="symbol">🎮</span>Acc đã mua
 </button>
 <button onclick="alert('Khu vực nạp tiền')">
  <span class="symbol">▣</span>Nạp tiền
 </button>
 <button onclick="alert('Tài khoản của bạn')">
  <span class="symbol">♙</span>Tài khoản
 </button>
</nav>

<script>
const data=[
 {name:"Túi acc Liên Quân VIP",game:"Liên Quân",price:39000,old:100000,sold:"6.6K",views:"8.8K",color:""},
 {name:"Acc Liên Quân Đại Chiến",game:"Liên Quân",price:149000,old:200000,sold:"3.6K",views:"8.9K",color:"purple"},
 {name:"Acc Free Fire VIP",game:"Free Fire",price:200000,old:400000,sold:"4.4K",views:"8.9K",color:"pink"},
 {name:"Acc Roblox cao cấp",game:"Roblox",price:299000,old:400000,sold:"6.6K",views:"9.1K",color:"gold"},
 {name:"Acc Liên Quân cực hạn",game:"Liên Quân",price:799000,old:1200000,sold:"3.6K",views:"6.6K",color:""},
 {name:"Acc Free Fire nhiều skin",game:"Free Fire",price:350000,old:500000,sold:"2.1K",views:"5.2K",color:"pink"}
];

const money=n=>n.toLocaleString("vi-VN")+" VNĐ";

function show(items){
 document.getElementById("products").innerHTML=items.map((p,i)=>`
 <article class="product">
  <div class="thumb ${p.color}">
   <button class="heart" onclick="this.innerText=this.innerText==='♡'?'♥':'♡'">♡</button>
   <strong>${p.game}<br>PDM GAMING</strong>
   <div class="sold">Đã bán: ${p.sold}　|　Xem: ${p.views}</div>
  </div>
  <div class="info">
   <div class="name">${p.name}</div>
   <div class="game">${p.game}</div>
   <div class="price">${money(p.price)}</div>
   <div class="old">${money(p.old)}</div>
   <button class="buy" onclick="alert('Sản phẩm demo. Chức năng mua sẽ được kết nối sau.')">Xem tài khoản →</button>
  </div>
 </article>`).join("");
}

function filter(game,el){
 document.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));
 el.classList.add("active");
 show(game==="Tất cả"?data:data.filter(p=>p.game===game));
}
function searchAcc(){
 let q=document.getElementById("search").value.toLowerCase();
 show(data.filter(p=>(p.name+p.game).toLowerCase().includes(q)));
}
function go(id){
 window.scrollTo({top:0,behavior:"smooth"});
}
show(data);
</script>
</body>
</html>
